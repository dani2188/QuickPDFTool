{% extends "base.html" %} {% block content %}

<h1>Sign PDF</h1>

<form method="POST" enctype="multipart/form-data" class="no-auto-submit">
  <!-- PDF Upload -->
  <div id="dropArea" class="upload-box">
    <p>Upload PDF</p>
    <input type="file" name="pdf" id="fileInput" hidden />
    <p id="fileName">No file selected</p>
  </div>

  <!-- Signature Upload -->
  <div id="signatureWrapper"
     style="
       position:absolute;
       top:50px;
       left:50px;
       width:120px;
       cursor:move;
     ">

  <img src="{{ url_for('static', filename=signature) }}"
       style="width:100%; display:block;">

  <!-- RESIZE HANDLE -->
  <div id="resizeHandle"
       style="
         width:12px;
         height:12px;
         background:#e5322d;
         position:absolute;
         right:0;
         bottom:0;
         cursor:se-resize;
       ">
  </div>

</div>
    <!-- DRAGGABLE SIGNATURE -->
    <img
      src="{{ url_for('static', filename=signature) }}"
      id="signatureBox"
      style="
        position: absolute;
        top: 50px;
        left: 50px;
        width: 120px;
        cursor: move;
      "
    />
  </div>

  <!-- hidden fields -->
  <input type="hidden" name="x" id="x" />
  <input type="hidden" name="y" id="y" />
  <input type="hidden" name="img_width" id="imgWidth" />
  <input type="hidden" name="img_height" id="imgHeight" />
  <input type="hidden" name="box_width" id="boxWidth" />
  <input type="hidden" name="box_height" id="boxHeight" />

  <input type="hidden" name="existing_file" value="{{ filename }}" />
  <input type="hidden" name="signature" value="{{ signature }}" />

  <br /><br />
  <button class="main-btn">Apply Signature</button>

  {% endif %}
</form>

<!-- DRAG SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function(){

  const wrapper = document.getElementById("signatureWrapper");
  const preview = document.getElementById("pdfPreview");
  const resizeHandle = document.getElementById("resizeHandle");

  if(wrapper && preview){

    let isDragging = false;
    let isResizing = false;

    let offsetX, offsetY;

    // 🖱 DRAG
    wrapper.addEventListener("mousedown", function(e){
      if(e.target === resizeHandle) return; // avoid conflict

      isDragging = true;
      offsetX = e.offsetX;
      offsetY = e.offsetY;
    });

    document.addEventListener("mousemove", function(e){

      const rect = preview.getBoundingClientRect();

      // DRAG
      if(isDragging){
        let x = e.clientX - rect.left - offsetX;
        let y = e.clientY - rect.top - offsetY;

        wrapper.style.left = x + "px";
        wrapper.style.top = y + "px";
      }

      // RESIZE
      if(isResizing){
        let newWidth = e.clientX - wrapper.getBoundingClientRect().left;
        wrapper.style.width = newWidth + "px";
      }

    });

    document.addEventListener("mouseup", function(){
      isDragging = false;
      isResizing = false;
    });

    // 🧩 RESIZE HANDLE
    resizeHandle.addEventListener("mousedown", function(e){
      e.stopPropagation();
      isResizing = true;
    });

    // 📤 SAVE DATA
    document.querySelector("form").addEventListener("submit", function(){

      const rect = preview.getBoundingClientRect();
      const boxRect = wrapper.getBoundingClientRect();

      document.getElementById("x").value = boxRect.left - rect.left;
      document.getElementById("y").value = boxRect.top - rect.top;

      document.getElementById("imgWidth").value = rect.width;
      document.getElementById("imgHeight").value = rect.height;

      document.getElementById("boxWidth").value = boxRect.width;
      document.getElementById("boxHeight").value = boxRect.height;

    });

  }

});
</script>

{% endblock %}
