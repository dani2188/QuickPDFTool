{% extends "base.html" %} {% block content %}

<h1>Sign PDF</h1>

<form method="POST" enctype="multipart/form-data" class="no-auto-submit">
  <!-- ========================= -->
  <!-- STEP 1 — UPLOAD -->
  <!-- ========================= -->
  {% if preview is not defined or not preview %}

  <div id="dropArea" class="upload-box">
    <p>Upload PDF</p>
    <input type="file" name="pdf" id="fileInput" hidden />
    <p id="fileName">No file selected</p>
  </div>

  <div
    class="upload-box"
    onclick="document.getElementById('signatureInput').click()"
  >
    <p>Upload Signature</p>
    <input type="file" name="signature" id="signatureInput" hidden />
    <p id="signatureName">No file selected</p>
  </div>

  <br />
  <button class="main-btn">Upload & Continue</button>

  {% endif %}

  <!-- ========================= -->
  <!-- STEP 2 — PREVIEW + EDIT -->
  <!-- ========================= -->
  {% if preview is defined and preview %}

  <div style="position: relative; display: inline-block; margin-top: 20px">
    <!-- PDF PREVIEW -->
    <img
      src="{{ url_for('static', filename=preview) }}"
      id="pdfPreview"
      style="max-width: 500px"
    />

    <!-- SIGNATURE BOX -->
    <div
      id="signatureWrapper"
      style="
        position: absolute;
        top: 50px;
        left: 50px;
        width: 120px;
        cursor: move;
      "
    >
      <img
        src="{{ url_for('static', filename=signature) }}"
        style="width: 100%; display: block"
      />

      <!-- RESIZE HANDLE -->
      <div
        id="resizeHandle"
        style="
          width: 12px;
          height: 12px;
          background: #e5322d;
          position: absolute;
          right: 0;
          bottom: 0;
          cursor: se-resize;
        "
      ></div>
    </div>
  </div>

  <!-- HIDDEN DATA -->
  <input type="hidden" name="x" id="x" />
  <input type="hidden" name="y" id="y" />
  <input type="hidden" name="img_width" id="imgWidth" />
  <input type="hidden" name="img_height" id="imgHeight" />
  <input type="hidden" name="box_width" id="boxWidth" />
  <input type="hidden" name="box_height" id="boxHeight" />

  <input type="hidden" name="existing_file" value="{{ filename }}" />
  <input type="hidden" name="signature_file" value="{{ signature }}" />

  <br /><br />
  <button class="main-btn">Apply Signature</button>

  {% endif %}
</form>

<!-- ========================= -->
<!-- DRAG + RESIZE SCRIPT -->
<!-- ========================= -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const signatureInput = document.getElementById("signatureInput");
    const signatureName = document.getElementById("signatureName");

    if (signatureInput) {
      signatureInput.addEventListener("change", function () {
        if (signatureInput.files.length > 0) {
          if (signatureName) {
            signatureName.textContent = signatureInput.files[0].name;
          }

          // 🔥 AUTO SUBMIT FORM
          signatureInput.closest("form").submit();
        }
      });
    }
  });
</script>

{% endblock %}
