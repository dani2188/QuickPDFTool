{% extends "base.html" %}

{% block title %}PDF to Excel Converter{% endblock %}

{% block content %}

<h1>PDF to Excel</h1>

<p class="subtitle">Convert tables from PDF into editable Excel files.</p>

<form method="POST" enctype="multipart/form-data">

<label class="upload-area" id="dropArea">

📄 Drop PDF here or click to upload

<input type="file" name="pdf" id="fileInput" accept="application/pdf">

</label>

<br>

<button class="main-btn">Convert to Excel</button>

</form>

{% endblock %}
