{% extends "base.html" %}

{% block content %}

<h1>Convert PDF to Excel</h1>
<p class="subtitle">Extract tables from PDF into Excel.</p>

<div id="dropArea" class="upload-box">
    <p>Upload PDF file</p>
    <input type="file" name="pdf" id="fileInput" hidden>
</div>

<button class="main-btn">Convert to Excel</button>

<div class="seo-content">

<h2>PDF to Excel Converter</h2>

<p>
Convert PDF tables into editable Excel spreadsheets.
</p>

<h3>Steps</h3>

<ol>
<li>Upload PDF</li>
<li>Click convert</li>
<li>Download Excel file</li>
</ol>

</div>

{% endblock %}
