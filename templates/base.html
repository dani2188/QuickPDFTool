<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}QuickPDFTool{% endblock %}</title>

    <meta
      name="description"
      content="{% block description %}Free online PDF tools to compress, convert and edit PDF files{% endblock %}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1115814677653739"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header class="topbar">
      <div class="header-wrapper">
        <div class="logo">
          <a href="/">QuickPDFTool</a>
        </div>

        <nav class="menu">
          <a href="/">Home</a>
          <a href="/pdf-tools">All Tools</a>
          <a href="/blog">Guides</a>
          <!-- link to quickimagetools -->
          <a href="https://quickimagetools.onrender.com/" target="_blank">
            Image Tools
          </a>
        </nav>
      </div>
    </header>

    <div class="main-container">{% block content %} {% endblock %}</div>

    <footer class="footer">
      <p>© 2026 QuickPDFTool</p>

      <p>Free online tools to compress, merge, convert and edit PDF files.</p>

      <div class="footer-links">
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms">Terms</a>
        <a href="/contact">Contact</a>
        <!-- link to quickimagetools -->
        <a href="https://quickimagetools.onrender.com/" target="_blank">
          Image Tools
        </a>
      </div>
    </footer>

    <script>
      function handleFileInput(inputId, nameId) {
        const input = document.getElementById(inputId);
        const name = document.getElementById(nameId);

        if (input && name) {
          input.addEventListener("change", function () {
            if (input.files.length === 1) {
              name.textContent = input.files[0].name;
            } else if (input.files.length > 1) {
              name.textContent = input.files.length + " files selected";
            }
          });
        }
      }

      /* MAIN PDF upload */
      const dropArea = document.getElementById("dropArea");
      const fileInput = document.getElementById("fileInput");

      if (dropArea && fileInput) {
        dropArea.addEventListener("click", () => fileInput.click());

        dropArea.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropArea.style.background = "#f4f5f7";
        });

        dropArea.addEventListener("dragleave", () => {
          dropArea.style.background = "#fafafa";
        });

        dropArea.addEventListener("drop", (e) => {
          e.preventDefault();
          fileInput.files = e.dataTransfer.files;
          dropArea.style.background = "#fafafa";

          const fileName = document.getElementById("fileName");
          if (fileName) {
            if (fileInput.files.length === 1) {
              fileName.textContent = fileInput.files[0].name;
            } else {
              fileName.textContent = fileInput.files.length + " files selected";
            }
          }
        });
      }

      /* APPLY TO INPUTS */
      handleFileInput("fileInput", "fileName");
      handleFileInput("signatureInput", "signatureName");
    </script>

    <script>
      const preview = document.getElementById("pdfPreview");

      if (preview) {
        preview.addEventListener("click", function (e) {
          const rect = preview.getBoundingClientRect();

          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          document.getElementById("x").value = x;
          document.getElementById("y").value = y;

          document.getElementById("coords").innerText =
            "Position selected: X=" + Math.round(x) + " Y=" + Math.round(y);
        });
      }
    </script>
  </body>
</html>
