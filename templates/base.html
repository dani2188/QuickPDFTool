<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}QuickPDFTool{% endblock %}</title>

    <meta
      name="description"
      content="{% block description %}Free online PDF tools to compress, convert and edit PDF files{% endblock %}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1115814677653739"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header class="topbar">
      <div class="header-wrapper">
        <div class="logo">
          <a href="/">QuickPDFTool</a>
        </div>

        <nav class="menu">
          <a href="/">Home</a>
          <a href="/pdf-tools">All Tools</a>
          <a href="/blog">Guides</a>
          <a href="https://quickimagetools.onrender.com/" target="_blank">
            Image Tools
          </a>
        </nav>
      </div>
    </header>

    <div class="main-container">{% block content %}{% endblock %}</div>

    <footer class="footer">
      <p>© 2026 QuickPDFTool</p>
      <p>Free online tools to compress, merge, convert and edit PDF files.</p>

      <div class="footer-links">
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms">Terms</a>
        <a href="/contact">Contact</a>
        <a href="https://quickimagetools.onrender.com/" target="_blank">
          Image Tools
        </a>
      </div>
    </footer>

    <!-- ✅ GLOBAL JS (UPLOAD + DRAG DROP + AUTO SUBMIT) -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.uploadInitialized) return;
        window.uploadInitialized = true;

        const dropArea = document.getElementById("dropArea");
        const fileInput = document.getElementById("fileInput");
        const fileName = document.getElementById("fileName");

        if (dropArea && fileInput && fileInput.closest("form")) {
          // CLICK → open file picker
          dropArea.addEventListener("click", () => {
            fileInput.click();
          });

          // FILE SELECT
          fileInput.addEventListener("change", () => {
            if (fileInput.files.length > 0) {
              if (fileName) {
                if (fileInput.files.length === 1) {
                  fileName.textContent = fileInput.files[0].name;
                } else {
                  fileName.textContent =
                    fileInput.files.length + " files selected";
                }
              }

              // ✅ FIXED: check FORM (not input)
              const form = fileInput.closest("form");

              if (!form.classList.contains("no-auto-submit")) {
                form.submit();
              }
            }
          });

          // DRAG OVER
          dropArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropArea.style.borderColor = "#e5322d";
          });

          // DRAG LEAVE
          dropArea.addEventListener("dragleave", () => {
            dropArea.style.borderColor = "#ccc";
          });

          // DROP FILE
          dropArea.addEventListener("drop", (e) => {
            e.preventDefault();

            fileInput.files = e.dataTransfer.files;

            if (fileInput.files.length > 0) {
              if (fileName) {
                fileName.textContent = fileInput.files[0].name;
              }

              // ✅ FIXED: check FORM (not input)
              const form = fileInput.closest("form");

              if (!form.classList.contains("no-auto-submit")) {
                form.submit();
              }
            }
          });
        }
      });
    </script>
  </body>
</html>
