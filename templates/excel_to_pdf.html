{% extends "base.html" %}

{% block content %}

<h1>Convert Excel to PDF</h1>
<p class="subtitle">Convert Excel files into PDF documents.</p>

<div id="dropArea" class="upload-box">
    <p>Upload Excel file</p>
    <input type="file" name="excel" id="fileInput" hidden>
</div>

<button class="main-btn">Convert to PDF</button>

<div class="seo-content">

<h2>Excel to PDF Converter</h2>

<p>
Convert spreadsheets into professional PDF documents.
</p>

<h3>Steps</h3>

<ol>
<li>Upload Excel file</li>
<li>Click convert</li>
<li>Download PDF</li>
</ol>

</div>

{% endblock %}
